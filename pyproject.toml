[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrdmnet"
version = "0.5.0"
description = "RDMnet (ANSI E1.33) broker and controller in pure Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Stefan Schlagbauer" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["rdmnet", "rdm", "e1.33", "e1.20", "dmx", "lighting", "broker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Networking",
]

[project.optional-dependencies]
zeroconf = ["zeroconf"]

[project.scripts]
pyrdmnet = "pyrdmnet.__main__:main"

[project.urls]
Homepage = "https://github.com/Schlagi-lx/pyrdmnet"
Changelog = "https://github.com/Schlagi-lx/pyrdmnet/blob/main/CHANGELOG.md"
Issues = "https://github.com/Schlagi-lx/pyrdmnet/issues"

[tool.setuptools]
packages = ["pyrdmnet"]
