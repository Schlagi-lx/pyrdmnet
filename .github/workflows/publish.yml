name: Publish to PyPI
# Runs when a GitHub release is published. Uses PyPI trusted publishing (no token stored anywhere):
# on pypi.org the project "pyrdmnet" trusts this repository, this workflow file and the environment "pypi".
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check the version matches the tag
        run: |
          test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
